<div id="zen-grammar-puzzle" style="padding:2rem; background:var(--bg-glass); border:1px solid {% if is_correct %}var(--accent-ok){% else %}var(--accent-warn){% endif %}; border-radius:24px; animation: fadeSlideIn 0.4s ease;">
  
  <div style="text-align:center; margin-bottom:1rem;">
    {% if is_correct %}
      <div style="font-size:3rem; margin-bottom:0.5rem;">🎉</div>
      <h3 style="color:var(--accent-ok); margin-bottom:0;">Esatto!</h3>
    {% else %}
      <div style="font-size:3rem; margin-bottom:0.5rem;">🤔</div>
      <h3 style="color:var(--accent-warn); margin-bottom:0;">Non proprio...</h3>
    {% endif %}
  </div>

  <div style="text-align:center; font-size:1.1rem; color:var(--text-primary); margin-bottom:1.5rem; font-weight:600;">
    "{{ sentence.italian }}"
  </div>

  <!-- Correct sentence display -->
  <div style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; padding:1rem; background:rgba(0,0,0,0.2); border-radius:12px; margin-bottom:2rem;">
    {% for block in sentence.blocks %}
      <div style="text-align:center;">
        <div style="font-size:1.2rem; font-weight:700; color:{% if block.is_particle %}var(--text-muted){% else %}var(--text-primary){% endif %};">
          {{ block.kanji if block.kanji else block.kana }}
        </div>
        <div style="font-size:0.75rem; color:var(--text-dim);">
          {{ block.romaji }}
        </div>
      </div>
    {% endfor %}
  </div>

  <div style="text-align:center;">
    {% if is_correct %}
      <button class="btn btn-primary" style="width:100%; max-width:250px;" hx-get="/api/zen/grammar?exclude={{ sentence.id }}" hx-target="#zen-grammar-puzzle" hx-swap="outerHTML">
        Prossima Frase →
      </button>
    {% else %}
      <button class="btn btn-glass" style="width:100%; max-width:250px; border-color:var(--accent-warn); color:var(--accent-warn);" hx-get="/api/zen/grammar?exclude={{ sentence.id }}" hx-target="#zen-grammar-puzzle" hx-swap="outerHTML">
        Riprova un'altra →
      </button>
    {% endif %}
  </div>
  
  {% if is_correct %}
  <script>
    {% set full_kana = "" %}
    {% for b in sentence.blocks %}{% set full_kana = full_kana ~ b.kana %}{% endfor %}
    setTimeout(() => speakJapanese("{{ full_kana }}"), 100);
  </script>
  {% endif %}
</div>
