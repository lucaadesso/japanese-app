{% extends "base.html" %}
{% block title %}Test di Posizionamento Adattivo — 日本語{% endblock %}

{% block head %}
<style>
.test-card {
  max-width: 500px;
  margin: 3rem auto;
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 2.5rem 2rem;
  box-shadow: var(--shadow-glow);
  text-align: center;
}
.char-display {
  font-size: 5rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 1rem;
}
.quiz-input {
  width: 100%;
  padding: 1rem;
  font-size: 1.2rem;
  text-align: center;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
  color: var(--text-primary);
  margin-bottom: 1rem;
}
.quiz-input:focus { outline: none; border-color: var(--accent-1); }
</style>
{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="test-card" id="test-container">
    <div style="font-size:0.8rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:1rem;" id="phase-label">Preparazione...</div>
    <div class="char-display" id="char-display">⏳</div>
    
    <input type="text" id="answer-input" class="quiz-input" placeholder="Scrivi la lettura (Romaji)..." autocomplete="off">
    
    <div style="display:flex; gap:0.5rem; justify-content:center;">
      <button class="btn btn-glass" onclick="submitAnswer(false)">Non lo so</button>
      <button class="btn btn-primary" onclick="submitAnswer(true)">Conferma</button>
    </div>
  </div>

  <div class="test-card" id="result-container" style="display:none;">
    <h2 style="font-size:1.8rem; margin-bottom:1rem;">Valutazione Completata</h2>
    <p style="color:var(--text-muted); margin-bottom:2rem;" id="result-text"></p>
    
    <form method="POST" action="/placement/submit">
      <input type="hidden" name="hiragana_max_idx" id="h_max" value="-1">
      <input type="hidden" name="katakana_max_idx" id="k_max" value="-1">
      <button type="submit" class="btn btn-primary btn-lg">Attiva Fast-Lane e Inizia 🚀</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const hGroups = {{ hiragana_groups | tojson }};
const kGroups = {{ katakana_groups | tojson }};
const hData = {{ h_data | tojson }};
const kData = {{ k_data | tojson }};

let currentPhase = 'hiragana';
let currentGroupIdx = 0;
let currentItem = null;

let hMaxIdx = -1;
let kMaxIdx = -1;

function normalise(s) { return s.trim().toLowerCase().replace(/\s+/g, ''); }

function getQuestion(phase, groupName) {
    const data = phase === 'hiragana' ? hData : kData;
    const candidates = data.filter(d => d[3] === groupName); // index 3 is group_name in data tuples
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
}

function renderQuestion() {
    const groups = currentPhase === 'hiragana' ? hGroups : kGroups;
    if (currentGroupIdx >= groups.length) {
        nextPhase();
        return;
    }
    
    document.getElementById('phase-label').innerText = currentPhase.toUpperCase() + ' - Livello ' + (currentGroupIdx + 1);
    
    currentItem = getQuestion(currentPhase, groups[currentGroupIdx]);
    if (!currentItem) {
        nextPhase();
        return;
    }
    
    document.getElementById('char-display').innerText = currentItem[0]; // front
    const inp = document.getElementById('answer-input');
    inp.value = '';
    inp.focus();
}

function nextPhase() {
    if (currentPhase === 'hiragana') {
        currentPhase = 'katakana';
        currentGroupIdx = 0;
        renderQuestion();
    } else {
        finishTest();
    }
}

function submitAnswer(attempted) {
    if (!currentItem) return;
    
    const inp = document.getElementById('answer-input').value;
    const isCorrect = attempted && (normalise(inp) === normalise(currentItem[1]) || normalise(inp) === normalise(currentItem[2]));
    
    if (isCorrect) {
        if (currentPhase === 'hiragana') hMaxIdx = currentGroupIdx;
        if (currentPhase === 'katakana') kMaxIdx = currentGroupIdx;
        currentGroupIdx++;
        renderQuestion();
    } else {
        // Failed or "I don't know" -> stop phase
        nextPhase();
    }
}

function finishTest() {
    document.getElementById('test-container').style.display = 'none';
    document.getElementById('result-container').style.display = 'block';
    
    document.getElementById('h_max').value = hMaxIdx;
    document.getElementById('k_max').value = kMaxIdx;
    
    let text = "Basato sulle tue risposte:<br>";
    if (hMaxIdx === -1) text += "<strong>Hiragana:</strong> Principiante Assoluto<br>";
    else text += `<strong>Hiragana:</strong> Livello stimato ${hMaxIdx + 1}/${hGroups.length}<br>`;
    
    if (kMaxIdx === -1) text += "<strong>Katakana:</strong> Principiante Assoluto";
    else text += `<strong>Katakana:</strong> Livello stimato ${kMaxIdx + 1}/${kGroups.length}`;
    
    document.getElementById('result-text').innerHTML = text;
}

document.getElementById('answer-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') submitAnswer(true);
});

// Start
renderQuestion();
</script>
{% endblock %}
